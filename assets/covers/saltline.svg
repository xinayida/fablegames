<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="saltBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="40%" stop-color="#141a20"/>
      <stop offset="75%" stop-color="#241b12"/>
      <stop offset="100%" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="saltSun" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#f7b733" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f7b733" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff5a40"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#saltBg)"/>

  <!-- Industrial Skyline & Port Horizon -->
  <circle cx="560" cy="220" r="180" fill="url(#saltSun)"/>
  <rect x="0" y="260" width="800" height="190" fill="#0b0e12" opacity="0.95"/>
  <line x1="0" y1="260" x2="800" y2="260" stroke="#ffb347" stroke-width="1.5" opacity="0.4"/>

  <!-- Container Cranes & Industrial Silhouettes -->
  <path d="M480,260 L480,110 L520,70 L640,70 L680,110 L680,260" fill="none" stroke="#222b35" stroke-width="6"/>
  <line x1="480" y1="110" x2="680" y2="110" stroke="#ffb347" stroke-width="2" opacity="0.6"/>
  <line x1="480" y1="110" x2="640" y2="260" stroke="#1d252f" stroke-width="3"/>
  <line x1="680" y1="110" x2="520" y2="260" stroke="#1d252f" stroke-width="3"/>

  <!-- Shipping Containers -->
  <rect x="40" y="210" width="160" height="70" rx="3" fill="#1b2a38" stroke="#334b61" stroke-width="2"/>
  <rect x="180" y="190" width="150" height="90" rx="3" fill="#8c3321" stroke="#b8462e" stroke-width="2"/>
  <rect x="80" y="140" width="140" height="70" rx="3" fill="#d97706" stroke="#fbbf24" stroke-width="2" opacity="0.85"/>
  <rect x="620" y="180" width="150" height="100" rx="3" fill="#1b2a38" stroke="#334b61" stroke-width="2"/>

  <!-- Tactical Reticle & Compass HUD -->
  <g transform="translate(400, 210)" filter="url(#glow)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#ffb347" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#ffb347" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#ff5a40"/>
    <line x1="-90" y1="0" x2="-40" y2="0" stroke="#ffb347" stroke-width="2"/>
    <line x1="40" y1="0" x2="90" y2="0" stroke="#ffb347" stroke-width="2"/>
    <line x1="0" y1="-90" x2="0" y2="-40" stroke="#ffb347" stroke-width="2"/>
    <line x1="0" y1="40" x2="0" y2="90" stroke="#ffb347" stroke-width="2"/>
  </g>

  <!-- Typography & Badges -->
  <rect x="40" y="40" width="90" height="28" rx="6" fill="#ffb347" fill-opacity="0.2" stroke="#ffb347" stroke-width="1"/>
  <text x="85" y="59" fill="#ffb347" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="2">3A FPS</text>

  <rect x="140" y="40" width="110" height="28" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
  <text x="195" y="59" fill="#22d3ee" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">CLAUDE AI</text>

  <text x="40" y="375" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="2">SALTLINE</text>
  <text x="40" y="410" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="18" letter-spacing="1">盐线 · 3A第一人称战术射击</text>

  <rect x="40" y="424" width="260" height="3" fill="url(#goldBar)"/>
</svg>
