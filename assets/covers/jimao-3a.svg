<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="45%" stop-color="#121829"/>
      <stop offset="85%" stop-color="#1a1528"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#ff5e36" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#7928ca" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyberCyan" cx="70%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="35%" stop-color="#ffd257"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.9"/>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1"/>
    </pattern>

    <!-- Linear Shading for Cat Helmet -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="armorMetal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Celestial Glow / Mega Sun -->
  <circle cx="400" cy="180" r="280" fill="url(#sunGlow)"/>
  <circle cx="650" cy="320" r="220" fill="url(#cyberCyan)"/>

  <!-- Cyber Grid Horizon -->
  <g opacity="0.8">
    <rect y="220" width="800" height="230" fill="url(#grid)" />
    <!-- Horizon perspective lines -->
    <path d="M0,320 L800,320 M0,360 L800,360 M0,400 L800,400 M0,430 L800,430" stroke="rgba(245, 158, 11, 0.15)" stroke-width="1.5"/>
    <path d="M400,220 L0,450 M400,220 L150,450 M400,220 L300,450 M400,220 L500,450 M400,220 L650,450 M400,220 L800,450" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.2"/>
  </g>

  <!-- Mountain Silhouettes in Background -->
  <polygon points="-50,280 80,190 220,270 340,160 510,280 660,180 850,290 850,450 -50,450" fill="#0c101d" opacity="0.95"/>
  <polygon points="-20,310 120,230 250,290 400,210 570,300 710,220 830,310 830,450 -20,450" fill="#131b2e" opacity="0.8"/>

  <!-- Distant Sci-Fi Monoliths & Cyber Beams -->
  <g opacity="0.6">
    <line x1="280" y1="230" x2="280" y2="40" stroke="#ffaa40" stroke-width="2" filter="url(#glowGold)"/>
    <line x1="560" y1="210" x2="560" y2="20" stroke="#00f2fe" stroke-width="2" filter="url(#glowCyan)"/>
    <rect x="275" y="160" width="10" height="70" fill="#1e293b"/>
    <rect x="555" y="140" width="10" height="80" fill="#1e293b"/>
  </g>

  <!-- Floating Particles & Stars -->
  <g fill="#ffc977" opacity="0.75">
    <circle cx="120" cy="80" r="2"/>
    <circle cx="210" cy="140" r="1.5"/>
    <circle cx="340" cy="90" r="2.5" filter="url(#glowGold)"/>
    <circle cx="680" cy="110" r="2"/>
    <circle cx="730" cy="65" r="1.5"/>
    <circle cx="490" cy="70" r="2"/>
  </g>

  <!-- Hero Cybernetic Cat (几猫) Centerpiece Silhouette & Neon Armor -->
  <g transform="translate(400, 205)" filter="url(#heavyDrop)">
    <!-- Cat Ears with Tech Accents -->
    <!-- Left Ear Outer -->
    <path d="M-65,-40 L-105,-155 L-25,-75 Z" fill="url(#armorMetal)" stroke="#ff9a3c" stroke-width="2.5"/>
    <!-- Left Ear Inner Neon Glow -->
    <path d="M-60,-48 L-95,-138 L-35,-75 Z" fill="#ff7a18" opacity="0.75" filter="url(#glowGold)"/>

    <!-- Right Ear Outer -->
    <path d="M65,-40 L105,-155 L25,-75 Z" fill="url(#armorMetal)" stroke="#00f2fe" stroke-width="2.5"/>
    <!-- Right Ear Inner Neon Glow -->
    <path d="M60,-48 L95,-138 L35,-75 Z" fill="#00f2fe" opacity="0.75" filter="url(#glowCyan)"/>

    <!-- Cat Head / Helmet Shell -->
    <ellipse cx="0" cy="-25" rx="90" ry="78" fill="url(#armorMetal)" stroke="#334155" stroke-width="3"/>

    <!-- Helmet Cyber Decals -->
    <path d="M-50,-85 L0,-65 L50,-85" fill="none" stroke="#64748b" stroke-width="3"/>
    <line x1="0" y1="-65" x2="0" y2="-30" stroke="#f59e0b" stroke-width="3" filter="url(#glowGold)"/>

    <!-- Tech Visor / Cyber Mask (Dual Color Glow) -->
    <path d="M-72,-25 Q0,10 72,-25 Q60,35 0,38 Q-60,35 -72,-25 Z" fill="url(#visorGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)"/>

    <!-- Visor Feline Eye Slits (Glowing Amber & Ice Blue) -->
    <!-- Left Eye -->
    <path d="M-48,-15 Q-30,-28 -14,-10 Q-30,-2 -48,-15 Z" fill="#fff" filter="url(#glowGold)"/>
    <ellipse cx="-31" cy="-14" rx="4" ry="9" fill="#ffb703"/>
    <!-- Right Eye -->
    <path d="M14,-10 Q30,-28 48,-15 Q30,-2 14,-10 Z" fill="#fff" filter="url(#glowCyan)"/>
    <ellipse cx="31" cy="-14" rx="4" ry="9" fill="#00f2fe"/>

    <!-- Cyber Whiskers (Light Beams) -->
    <g stroke-linecap="round" opacity="0.9">
      <!-- Left Whiskers -->
      <line x1="-70" y1="5" x2="-140" y2="-5" stroke="#ff9a3c" stroke-width="2.5" filter="url(#glowGold)"/>
      <line x1="-72" y1="18" x2="-145" y2="25" stroke="#ff9a3c" stroke-width="2.5" filter="url(#glowGold)"/>
      <!-- Right Whiskers -->
      <line x1="70" y1="5" x2="140" y2="-5" stroke="#00f2fe" stroke-width="2.5" filter="url(#glowCyan)"/>
      <line x1="72" y1="18" x2="145" y2="25" stroke="#00f2fe" stroke-width="2.5" filter="url(#glowCyan)"/>
    </g>

    <!-- Collar / High-Tech Power Core -->
    <path d="M-55,38 L55,38 L40,75 L-40,75 Z" fill="#090d16" stroke="#475569" stroke-width="2.5"/>
    <circle cx="0" cy="56" r="14" fill="#06b6d4" stroke="#e0f2fe" stroke-width="2" filter="url(#glowCyan)"/>
    <circle cx="0" cy="56" r="6" fill="#fff"/>

    <!-- Body Torso Silhouette -->
    <path d="M-85,75 Q-140,160 -160,240 L160,240 Q140,160 85,75 Z" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <!-- Neon Armor Trim on Shoulders -->
    <path d="M-80,95 Q-115,145 -130,210" fill="none" stroke="#ff9a3c" stroke-width="3" filter="url(#glowGold)"/>
    <path d="M80,95 Q115,145 130,210" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glowCyan)"/>
  </g>

  <!-- Vignette & Bottom Shadow for Contrast -->
  <rect y="260" width="800" height="190" fill="url(#bgGrad)" opacity="0.6"/>

  <!-- Top Badges & Highlights -->
  <g transform="translate(30, 32)">
    <!-- 3A Quality Badge -->
    <rect width="82" height="28" rx="6" fill="#ffb703" fill-opacity="0.15" stroke="#ffb703" stroke-width="1.5"/>
    <text x="41" y="19" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#ffd166" text-anchor="middle" letter-spacing="1">★ 3A 旗舰</text>

    <!-- WebGL 3D Badge -->
    <rect x="94" width="110" height="28" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="149" y="19" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">3D 开放世界</text>
  </g>

  <!-- Top Right Rating Badge -->
  <g transform="translate(680, 32)">
    <rect width="90" height="28" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="45" y="19" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" fill="#a78bfa" text-anchor="middle" letter-spacing="0.5">⭐ 4.9 / 5.0</text>
  </g>

  <!-- Main Game Typography / Title Section -->
  <g transform="translate(400, 375)" text-anchor="middle" filter="url(#heavyDrop)">
    <!-- Subtitle / Tagline -->
    <text y="-28" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#38bdf8" letter-spacing="5" filter="url(#glowCyan)">FELINE 3A ODYSSEY</text>
    <!-- Main Chinese Title with Metallic Gold Gradient -->
    <text y="18" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif" font-weight="900" font-size="46" fill="url(#goldText)" letter-spacing="4" filter="url(#glowGold)">几猫 3A 大作</text>
    <!-- English & Category Footer Banner -->
    <text y="45" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="13" fill="#94a3b8" letter-spacing="2">次世代高保真 · 赛博流浪猫冒险 · 即点即玩</text>
  </g>

  <!-- Corner Tech HUD Borders -->
  <path d="M15,25 L15,15 L25,15" fill="none" stroke="#00f2fe" stroke-width="2"/>
  <path d="M785,25 L785,15 L775,15" fill="none" stroke="#00f2fe" stroke-width="2"/>
  <path d="M15,425 L15,435 L25,435" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <path d="M785,425 L785,435 L775,435" fill="none" stroke="#f59e0b" stroke-width="2"/>
</svg>
