<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="guanyuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e0c"/>
      <stop offset="40%" stop-color="#0f1f1a"/>
      <stop offset="80%" stop-color="#1c2b22"/>
      <stop offset="100%" stop-color="#070a09"/>
    </linearGradient>
    <linearGradient id="dragonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="bladeAura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="guanyuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#guanyuBg)"/>

  <!-- Mountain Silhouette & Mythical Fog -->
  <circle cx="480" cy="180" r="160" fill="url(#bladeAura)"/>
  <path d="M-50,340 Q150,220 380,260 T800,200 L850,450 L-50,450 Z" fill="#0b1713" opacity="0.8"/>
  <path d="M100,380 Q350,290 600,320 T900,280 L900,450 L100,450 Z" fill="#060e0b" opacity="0.95"/>

  <!-- Swirling Dragon Blade Aura -->
  <path d="M220,380 Q320,180 500,120 T700,80" fill="none" stroke="url(#dragonGreen)" stroke-width="6" opacity="0.6" filter="url(#guanyuGlow)"/>
  <path d="M260,390 Q340,210 520,140 T680,110" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8"/>

  <!-- Legendary Green Dragon Crescent Blade (青龙偃月刀) -->
  <g transform="translate(480, 160) rotate(-35)" filter="url(#guanyuGlow)">
    <!-- Long Shaft -->
    <line x1="-180" y1="0" x2="160" y2="0" stroke="#78350f" stroke-width="9" stroke-linecap="round"/>
    <line x1="-180" y1="0" x2="160" y2="0" stroke="#d97706" stroke-width="3" stroke-dasharray="16 8"/>
    <!-- Dragon Head Mount -->
    <polygon points="150,-14 185,-8 195,0 185,8 150,14" fill="#fbbf24"/>
    <circle cx="172" cy="-2" r="3" fill="#dc2626"/> <!-- Dragon Eye -->
    <!-- Massive Curved Crescent Blade -->
    <path d="M185,-6 Q260,-40 330,-10 Q310,40 220,18 L185,6 Z" fill="#e2e8f0" stroke="#10b981" stroke-width="3"/>
    <path d="M200,-4 Q255,-28 310,-8" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <!-- Blade Tassel & Red Cloth -->
    <path d="M150,10 Q120,40 100,70" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Badges -->
  <rect x="40" y="40" width="90" height="28" rx="6" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="1.5"/>
  <text x="85" y="59" fill="#34d399" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">武圣 3A</text>

  <rect x="140" y="40" width="90" height="28" rx="6" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="185" y="59" fill="#fde047" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">动作 RPG</text>

  <!-- Typography -->
  <text x="40" y="375" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="2">BLACK MYTH: GUAN YU</text>
  <text x="40" y="410" fill="#a7f3d0" font-family="system-ui, sans-serif" font-weight="600" font-size="18" letter-spacing="1">黑神话 · 关羽 / 青龙偃月 · 武圣降世</text>

  <rect x="40" y="424" width="360" height="3" fill="url(#dragonGreen)"/>
</svg>
