<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="fallbackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="50%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>

    <!-- Neon Controller Glow -->
    <radialGradient id="controllerAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <!-- Isometric Grid Pattern -->
    <pattern id="meshGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(139, 92, 246, 0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#fallbackBg)"/>
  <rect width="800" height="450" fill="url(#meshGrid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="400" cy="200" r="320" fill="url(#controllerAura)"/>

  <!-- Ambient Diagonal Light Beams -->
  <polygon points="100,-50 250,-50 450,500 300,500" fill="url(#primaryNeon)" opacity="0.04"/>
  <polygon points="550,-50 700,-50 900,500 750,500" fill="url(#primaryNeon)" opacity="0.04"/>

  <!-- Futuristic Gamepad Centerpiece -->
  <g transform="translate(400, 195)" filter="url(#cardShadow)">
    <!-- Gamepad Outer Shell Silhouette -->
    <path d="M-170,10 
             C-170,-60 -90,-80 0,-80 
             C90,-80 170,-60 170,10 
             C170,70 140,130 95,120 
             C70,115 55,60 0,60 
             C-55,60 -70,115 -95,120 
             C-140,130 -170,70 -170,10 Z" 
          fill="url(#cardGrad)" stroke="url(#primaryNeon)" stroke-width="3"/>

    <!-- Inner Ergonomic Grips -->
    <path d="M-140,15 C-145,55 -125,95 -100,90" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M140,15 C145,55 125,95 100,90" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

    <!-- Left D-Pad -->
    <g transform="translate(-80, 5)">
      <path d="M-10,-32 L10,-32 L10,-10 L32,-10 L32,10 L10,10 L10,32 L-10,32 L-10,10 L-32,10 L-32,-10 L-10,-10 Z" 
            fill="#090d16" stroke="#06b6d4" stroke-width="2" filter="url(#softGlow)"/>
      <polygon points="0,-25 -6,-16 6,-16" fill="#06b6d4"/>
      <polygon points="0,25 -6,16 6,16" fill="#06b6d4"/>
      <polygon points="-25,0 -16,-6 -16,6" fill="#06b6d4"/>
      <polygon points="25,0 16,-6 16,6" fill="#06b6d4"/>
    </g>

    <!-- Right Action Buttons (Diamond Layout: Y, X, B, A) -->
    <g transform="translate(80, 5)">
      <!-- Top (Y) -->
      <circle cx="0" cy="-22" r="10" fill="#090d16" stroke="#8b5cf6" stroke-width="2" filter="url(#softGlow)"/>
      <text x="0" y="-18" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" fill="#c084fc" text-anchor="middle">Y</text>
      <!-- Bottom (A) -->
      <circle cx="0" cy="22" r="10" fill="#090d16" stroke="#06b6d4" stroke-width="2" filter="url(#softGlow)"/>
      <text x="0" y="26" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">A</text>
      <!-- Left (X) -->
      <circle cx="-22" cy="0" r="10" fill="#090d16" stroke="#ec4899" stroke-width="2" filter="url(#softGlow)"/>
      <text x="0" y="4" transform="translate(-22,0)" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" fill="#f472b6" text-anchor="middle">X</text>
      <!-- Right (B) -->
      <circle cx="22" cy="0" r="10" fill="#090d16" stroke="#eab308" stroke-width="2" filter="url(#softGlow)"/>
      <text x="0" y="4" transform="translate(22,0)" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" fill="#fde047" text-anchor="middle">B</text>
    </g>

    <!-- Twin Thumbsticks (Glowing rings) -->
    <g transform="translate(-35, 40)">
      <circle cx="0" cy="0" r="16" fill="#0b0f19" stroke="#475569" stroke-width="2"/>
      <circle cx="0" cy="0" r="11" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#softGlow)"/>
    </g>
    <g transform="translate(35, 40)">
      <circle cx="0" cy="0" r="16" fill="#0b0f19" stroke="#475569" stroke-width="2"/>
      <circle cx="0" cy="0" r="11" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#softGlow)"/>
    </g>

    <!-- Center Logo Emblem / Home Button -->
    <circle cx="0" cy="-20" r="15" fill="#090d16" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow)"/>
    <path d="M-6,-20 L6,-20 M0,-26 L0,-14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Light Bar Indicator Strip -->
    <path d="M-35,-52 Q0,-46 35,-52" fill="none" stroke="url(#primaryNeon)" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(30, 32)">
    <rect width="105" height="28" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="52" y="19" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="12" fill="#c084fc" text-anchor="middle">🎮 HTML5 游戏</text>
  </g>

  <g transform="translate(680, 32)">
    <rect width="90" height="28" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="45" y="19" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" fill="#38bdf8" text-anchor="middle" letter-spacing="1">INSTANT PLAY</text>
  </g>

  <!-- Bottom Typography Banner -->
  <g transform="translate(400, 375)" text-anchor="middle" filter="url(#cardShadow)">
    <text y="-25" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#38bdf8" letter-spacing="6" filter="url(#softGlow)">FABLEGAMES ARCADE</text>
    <text y="18" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif" font-weight="900" font-size="40" fill="#fff" letter-spacing="3">精品网页微端游戏</text>
    <text y="45" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="13" fill="#94a3b8" letter-spacing="2">免下载 · 零等待 · 沉浸式全屏微端体验</text>
  </g>

  <!-- Corner Tech HUD Accents -->
  <path d="M15,25 L15,15 L25,15" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M785,25 L785,15 L775,15" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M15,425 L15,435 L25,435" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <path d="M785,425 L785,435 L775,435" fill="none" stroke="#06b6d4" stroke-width="2"/>
</svg>
