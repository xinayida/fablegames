<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="arcaneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0716"/>
      <stop offset="35%" stop-color="#180e2f"/>
      <stop offset="70%" stop-color="#240e3f"/>
      <stop offset="100%" stop-color="#080312"/>
    </linearGradient>

    <!-- Fire Gradients -->
    <radialGradient id="fireBurst" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff176" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#ff7043" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#d84315" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#bf360c"/>
      <stop offset="40%" stop-color="#ff5722"/>
      <stop offset="80%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#fff9c4"/>
    </linearGradient>

    <!-- Lightning Gradients -->
    <radialGradient id="lightningAura" cx="70%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e0f7fa" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#7c4dff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Arcane Gold/Cyan Title Gradients -->
    <linearGradient id="mageTitleGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="30%" stop-color="#ff5252"/>
      <stop offset="70%" stop-color="#e040fb"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="thunderGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="mageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.9"/>
    </filter>

    <!-- Magic Rune Wheel Pattern -->
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#311b92" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Mystical Void Canvas -->
  <rect width="800" height="450" fill="url(#arcaneBg)"/>

  <!-- Arcane Elemental Halos (Left Fire, Right Lightning) -->
  <circle cx="240" cy="210" r="260" fill="url(#fireBurst)"/>
  <circle cx="580" cy="180" r="260" fill="url(#lightningAura)"/>
  <circle cx="400" cy="200" r="200" fill="url(#portalCore)"/>

  <!-- Concentric Arcane Spell Circles (Runic Geometry) -->
  <g transform="translate(400, 200)" stroke-opacity="0.4" fill="none">
    <circle r="170" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="10 6"/>
    <circle r="140" stroke="#00e5ff" stroke-width="2" stroke-dasharray="16 8 4 8"/>
    <circle r="110" stroke="#ff9100" stroke-width="1.5"/>
    <circle r="80" stroke="#d8b4fe" stroke-width="1" stroke-dasharray="6 6"/>

    <!-- Sacred Geometry Triangles & Stars -->
    <polygon points="0,-140 121,70 -121,70" stroke="#ff5252" stroke-width="1.5" stroke-opacity="0.3"/>
    <polygon points="0,140 -121,-70 121,-70" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Arcane Glyphs on Rim -->
    <circle cx="0" cy="-140" r="6" fill="#00e5ff" filter="url(#thunderGlow)"/>
    <circle cx="121" cy="70" r="6" fill="#ff7043" filter="url(#flameGlow)"/>
    <circle cx="-121" cy="70" r="6" fill="#b388ff" filter="url(#thunderGlow)"/>
  </g>

  <!-- Lightning Bolts Crackling Across Canvas -->
  <g stroke-linecap="round" stroke-linejoin="round" filter="url(#thunderGlow)">
    <path d="M520,30 L550,110 L510,130 L570,220 L530,240 L590,340" fill="none" stroke="#e0f7fa" stroke-width="3.5"/>
    <path d="M520,30 L550,110 L510,130 L570,220 L530,240 L590,340" fill="none" stroke="#00e5ff" stroke-width="7" opacity="0.4"/>

    <path d="M680,60 L640,140 L670,160 L620,270" fill="none" stroke="#80d8ff" stroke-width="2.5"/>
    <path d="M470,160 L500,200 L480,220 L530,280" fill="none" stroke="#b388ff" stroke-width="2"/>
    <path d="M370,110 L410,150 L390,170 L440,220" fill="none" stroke="#e0f7fa" stroke-width="2"/>
  </g>

  <!-- Blazing Fire Spores & Fireball Flares (Left Side) -->
  <g filter="url(#flameGlow)">
    <!-- Swirling Meteor / Fireball Core -->
    <ellipse cx="190" cy="220" rx="65" ry="65" fill="url(#fireGrad)"/>
    <circle cx="190" cy="220" r="30" fill="#fff" opacity="0.9"/>

    <!-- Fire Jets and Tendrils -->
    <path d="M190,155 Q240,110 270,180 Q220,170 240,210 Q260,250 200,280 Q150,260 130,210 Q140,160 190,155 Z" fill="#ff5722" opacity="0.6"/>
    <path d="M160,180 Q190,120 220,170 Q240,220 180,250 Z" fill="#ffeb3b" opacity="0.7"/>

    <!-- Fiery Ember Particles -->
    <circle cx="110" cy="160" r="4" fill="#ffab00"/>
    <circle cx="130" cy="290" r="5" fill="#ff6d00"/>
    <circle cx="280" cy="140" r="3.5" fill="#ffd54f"/>
    <circle cx="310" cy="260" r="4" fill="#ff3d00"/>
    <circle cx="230" cy="320" r="4.5" fill="#ff9100"/>
  </g>

  <!-- Central Hero Elementalist Silhouette & Glowing Staff -->
  <g transform="translate(390, 190)" filter="url(#mageShadow)">
    <!-- Arcane Wizard Cloak / Robe Silhouette -->
    <path d="M-50,190 L-40,80 L-22,35 L0,20 L22,35 L40,80 L50,190 L0,180 Z" fill="#0f0c1b" stroke="#311b92" stroke-width="2.5"/>

    <!-- Pointed Wizard Hat Silhouette -->
    <path d="M-60,35 Q-5,15 0,-70 Q20,15 60,35 Q0,45 -60,35 Z" fill="#130e26" stroke="#4a148c" stroke-width="2"/>
    <path d="M-30,28 Q0,10 30,28" stroke="#ff9100" stroke-width="3" fill="none" filter="url(#flameGlow)"/>

    <!-- Mysterious Glowing Eyes in Shadow -->
    <circle cx="-10" cy="42" r="2.5" fill="#00e5ff" filter="url(#thunderGlow)"/>
    <circle cx="10" cy="42" r="2.5" fill="#00e5ff" filter="url(#thunderGlow)"/>

    <!-- Arcane Staff Held in Hand -->
    <g transform="translate(65, -30)">
      <!-- Staff Shaft -->
      <line x1="0" y1="240" x2="0" y2="10" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="240" x2="0" y2="10" stroke="#b45309" stroke-width="2"/>

      <!-- Staff Crystal Top / Elemental Catalyst -->
      <polygon points="0,-40 -20,-10 0,20 20,-10" fill="#00f5ff" stroke="#fff" stroke-width="2" filter="url(#thunderGlow)"/>
      <circle cx="0" cy="-10" r="10" fill="#fff"/>
      <!-- Energy Rings around Crystal -->
      <ellipse cx="0" cy="-10" rx="32" ry="12" fill="none" stroke="#ff9100" stroke-width="2.5" transform="rotate(-25)" filter="url(#flameGlow)"/>
      <ellipse cx="0" cy="-10" rx="32" ry="12" fill="none" stroke="#00e5ff" stroke-width="2.5" transform="rotate(25)" filter="url(#thunderGlow)"/>
    </g>

    <!-- Hand Left Casting Fire Sphere -->
    <g transform="translate(-65, 70)">
      <circle cx="0" cy="0" r="16" fill="#ff7043" filter="url(#flameGlow)"/>
      <circle cx="0" cy="0" r="8" fill="#fffde7"/>
    </g>
  </g>

  <!-- Ice Crystal Shards (Frost Element) Floating in Center -->
  <g filter="url(#thunderGlow)" opacity="0.85">
    <polygon points="340,90 350,70 355,95 345,115" fill="#b2ebf2" stroke="#e0f7fa" stroke-width="1.5"/>
    <polygon points="460,110 475,90 480,120 465,140" fill="#80deea" stroke="#fff" stroke-width="1.5"/>
    <polygon points="310,290 325,275 328,300 315,315" fill="#80d8ff" stroke="#e0f7fa" stroke-width="1.2"/>
  </g>

  <!-- Vignette Bottom Layer -->
  <rect y="260" width="800" height="190" fill="url(#arcaneBg)" opacity="0.6"/>

  <!-- Top Badges & Highlights -->
  <g transform="translate(30, 32)">
    <!-- Action/Shooter Category Badge -->
    <rect width="90" height="28" rx="6" fill="#ff5722" fill-opacity="0.15" stroke="#ff5722" stroke-width="1.5"/>
    <text x="45" y="19" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="12" fill="#ff8a65" text-anchor="middle">🔥 动作割草</text>

    <!-- New Release Badge -->
    <rect x="102" width="90" height="28" rx="6" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="147" y="19" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#80deea" text-anchor="middle" letter-spacing="1">NEW 新游</text>
  </g>

  <!-- Top Right Rating Badge -->
  <g transform="translate(680, 32)">
    <rect width="90" height="28" rx="6" fill="#1e1b4b" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="45" y="19" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" fill="#00e5ff" text-anchor="middle" letter-spacing="0.5">⭐ 4.8 / 5.0</text>
  </g>

  <!-- Bottom Main Game Title Typography -->
  <g transform="translate(400, 375)" text-anchor="middle" filter="url(#mageShadow)">
    <!-- Subtitle / Tagline -->
    <text y="-28" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#00e5ff" letter-spacing="5" filter="url(#thunderGlow)">ELEMENTAL MAGE · ARCANE SURVIVORS</text>
    <!-- Main Chinese Title with Fire-to-Thunder Gradient -->
    <text y="18" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif" font-weight="900" font-size="44" fill="url(#mageTitleGrad)" letter-spacing="3" filter="url(#flameGlow)">元素法师 · 火球与闪电</text>
    <!-- Feature Subtext -->
    <text y="45" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="13" fill="#c084fc" letter-spacing="2">三系禁忌元素切换 · 全屏弹幕割草 · 极致解压</text>
  </g>

  <!-- Corner Arcane Accents -->
  <path d="M15,25 L15,15 L25,15" fill="none" stroke="#ff9100" stroke-width="2"/>
  <path d="M785,25 L785,15 L775,15" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M15,425 L15,435 L25,435" fill="none" stroke="#ff5252" stroke-width="2"/>
  <path d="M785,425 L785,435 L775,435" fill="none" stroke="#a855f7" stroke-width="2"/>
</svg>
