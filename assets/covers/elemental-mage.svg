<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="fireFrost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="magicOrb" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="mageGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#mageBg)"/>
  <circle cx="460" cy="200" r="170" fill="url(#magicOrb)"/>

  <!-- Magic Circles & Arcane Runes -->
  <g transform="translate(460, 200)" filter="url(#mageGlow)">
    <circle cx="0" cy="0" r="85" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="16 8"/>
    <!-- Triangular arcane star -->
    <polygon points="0,-75 65,37 -65,37" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="0,75 65,-37 -65,-37" fill="none" stroke="#ef4444" stroke-width="2"/>
    <!-- Central elemental core -->
    <circle cx="0" cy="0" r="28" fill="#e0f2fe" stroke="#06b6d4" stroke-width="3"/>
  </g>

  <!-- Elemental Spark Particles -->
  <g opacity="0.8">
    <circle cx="340" cy="140" r="4" fill="#ef4444"/>
    <circle cx="580" cy="130" r="5" fill="#f59e0b"/>
    <circle cx="560" cy="270" r="6" fill="#06b6d4"/>
    <circle cx="360" cy="280" r="4" fill="#8b5cf6"/>
    <line x1="460" y1="200" x2="310" y2="100" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10 15"/>
    <line x1="460" y1="200" x2="610" y2="110" stroke="#ef4444" stroke-width="2" stroke-dasharray="12 18"/>
    <line x1="460" y1="200" x2="600" y2="300" stroke="#06b6d4" stroke-width="2" stroke-dasharray="14 16"/>
  </g>

  <!-- Badges -->
  <rect x="40" y="40" width="84" height="28" rx="6" fill="#06b6d4" fill-opacity="0.25" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="82" y="59" fill="#22d3ee" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">元素射击</text>

  <rect x="134" y="40" width="84" height="28" rx="6" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="176" y="59" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">魔法奥术</text>

  <!-- Typography -->
  <text x="40" y="375" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="2">ELEMENTAL MAGE</text>
  <text x="40" y="410" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="600" font-size="18" letter-spacing="1">元素法师 · 火球与闪电 / 元素连锁轰击</text>

  <rect x="40" y="424" width="360" height="3" fill="url(#fireFrost)"/>
</svg>
