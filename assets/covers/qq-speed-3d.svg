<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="speedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e26"/>
      <stop offset="50%" stop-color="#0d2354"/>
      <stop offset="100%" stop-color="#040917"/>
    </linearGradient>
    <linearGradient id="nitroNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
    <linearGradient id="carGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="speedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#speedBg)"/>

  <!-- Speed Lines & Motion Blur Grid -->
  <g opacity="0.35">
    <line x1="0" y1="360" x2="800" y2="280" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="390" x2="800" y2="320" stroke="#00f2fe" stroke-width="3"/>
    <line x1="0" y1="430" x2="800" y2="370" stroke="#f43f5e" stroke-width="2"/>
    <line x1="100" y1="0" x2="700" y2="450" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="20 15"/>
    <line x1="250" y1="0" x2="850" y2="450" stroke="#38bdf8" stroke-width="1" stroke-dasharray="30 20"/>
  </g>

  <!-- Glowing Drift Trail / Nitro Flame -->
  <path d="M120,380 Q320,350 480,260 T780,210" fill="none" stroke="url(#nitroNeon)" stroke-width="8" filter="url(#speedGlow)"/>
  <path d="M140,388 Q330,360 490,270 T770,220" fill="none" stroke="#f43f5e" stroke-width="4" opacity="0.8"/>

  <!-- Stylized 3D Racecar Silhouette -->
  <g transform="translate(380, 160)" filter="url(#speedGlow)">
    <!-- Aerodynamic Chassis -->
    <path d="M-120,80 L-60,40 L60,30 L160,50 L200,75 L160,95 L-40,95 Z" fill="url(#carGlow)" stroke="#38bdf8" stroke-width="3"/>
    <!-- Cockpit & Windshield -->
    <polygon points="10,32 70,30 120,50 30,55" fill="#e0f2fe" opacity="0.85"/>
    <!-- Rear Spoiler -->
    <path d="M-130,45 L-110,40 L-100,65 L-120,70 Z" fill="#38bdf8"/>
    <!-- Headlight Beams -->
    <polygon points="200,75 360,40 380,120 200,90" fill="#38bdf8" opacity="0.25"/>
    <!-- Neon Wheel Flares -->
    <ellipse cx="-40" cy="95" rx="30" ry="14" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
    <ellipse cx="140" cy="95" rx="28" ry="13" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Badges -->
  <rect x="40" y="40" width="84" height="28" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="82" y="59" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="2">3D 竞速</text>

  <rect x="134" y="40" width="84" height="28" rx="6" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="176" y="59" fill="#fb7185" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">HOT 🔥</text>

  <!-- Typography -->
  <text x="40" y="375" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="2">QQ SPEED 3D</text>
  <text x="40" y="410" fill="#93c5fd" font-family="system-ui, sans-serif" font-weight="600" font-size="18" letter-spacing="1">QQ飞车 3D · 极速漂移 / 双喷过弯</text>

  <rect x="40" y="424" width="320" height="3" fill="url(#nitroNeon)"/>
</svg>
