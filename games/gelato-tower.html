<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torre di Gelato</title>
<style>
:root{
  --cream:#FFF1E6; --pink:#F7A8B8; --mint:#B5E2C4; --lemon:#FFE29A; --brown:#8B5E3C; --tan:#D9A566; --blue:#7BB7E0;
  --paper:#FFF9F1;
  --script:"Brush Script MT","Segoe Script","Snell Roundhand","Apple Chancery","Lucida Handwriting",cursive;
  --round:"Arial Rounded MT Bold","Trebuchet MS","Gill Sans",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--cream);color:var(--brown);font-family:var(--round);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer;outline:none}

/* top controls */
.top{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;align-items:center;gap:8px;z-index:5}
.btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--brown);background:var(--paper);color:var(--brown);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(123,183,224,.75);
  transition:transform .35s var(--spring),box-shadow .2s var(--out),background .2s}
.btn:hover{transform:translateY(-2px) rotate(-6deg);box-shadow:0 5px 0 rgba(123,183,224,.75);background:#fff}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(123,183,224,.75)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn .fill{fill:currentColor;stroke:none}
#bSound .on{display:none} #bSound[aria-pressed="true"] .on{display:block} #bSound[aria-pressed="true"] .off{display:none}
#bPause .play{display:none} #bPause[aria-pressed="true"] .play{display:block} #bPause[aria-pressed="true"] .bars{display:none}
:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
.spoons{display:flex;gap:5px;padding:5px 11px 3px;background:var(--paper);border:1.5px solid var(--brown);border-radius:22px;
  box-shadow:0 3px 0 rgba(123,183,224,.75)}
.spoons svg{width:11px;height:30px;transform-origin:50% 90%;transition:transform .7s var(--spring),opacity .5s var(--out)}
.spoons svg:nth-child(1){fill:var(--pink)} .spoons svg:nth-child(2){fill:var(--mint)} .spoons svg:nth-child(3){fill:var(--lemon)}
.spoons svg{stroke:var(--brown);stroke-width:.9}
.spoons svg.gone{transform:translateY(3px) rotate(38deg) scale(.86);opacity:.4;fill:var(--cream)!important}
.game-ui{opacity:0;transform:translateY(-14px);transition:opacity .4s var(--out),transform .6s var(--spring);pointer-events:none}
body.playing .game-ui{opacity:1;transform:none;pointer-events:auto}

/* price-board */
.board{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:4;width:142px;padding:9px 12px 8px;
  background:var(--brown);color:var(--cream);border-radius:7px 7px 5px 5px;border:3px solid #a9774f;
  box-shadow:0 5px 0 rgba(123,183,224,.7), inset 0 0 0 1px rgba(255,241,230,.18);
  transform:translateY(150%) rotate(-7deg);transform-origin:20% 100%;transition:transform .8s var(--spring);pointer-events:none}
body.playing .board{transform:rotate(-2.2deg)}
.board:before{content:"";position:absolute;left:50%;top:-12px;width:36px;height:10px;margin-left:-18px;border:3px solid #a9774f;border-bottom:0;border-radius:9px 9px 0 0}
.board .row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--script);font-size:19px;line-height:1.12}
.board b{font-family:var(--script);font-weight:400;font-size:25px;color:var(--lemon);display:inline-block}
.board b.pop{animation:pop .5s var(--spring)}
.board .m{margin-top:4px;padding-top:4px;border-top:1.5px dashed rgba(255,241,230,.45);font-size:15px;gap:6px;justify-content:flex-start}
.board .m b{font-size:21px;color:var(--pink)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.5) rotate(-8deg)}100%{transform:scale(1)}}

/* flavour ticket */
.ticket{position:fixed;right:10px;bottom:max(12px,env(safe-area-inset-bottom));z-index:4;min-width:128px;max-width:46vw;padding:8px 14px 9px 20px;
  background:var(--paper);color:var(--brown);border:1.5px solid var(--brown);border-radius:4px;text-align:left;
  box-shadow:0 4px 0 rgba(123,183,224,.7);transform:translateX(140%) rotate(6deg);transition:transform .7s var(--spring);pointer-events:none}
body.playing .ticket{transform:rotate(1.8deg)}
.ticket:before{content:"";position:absolute;left:6px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--cream);border:1.5px solid var(--brown)}
.ticket small{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#5d93bd}
.ticket strong{display:block;font-family:var(--script);font-weight:400;font-size:27px;line-height:1;margin:1px 0 2px;white-space:nowrap}
.ticket em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.05em;color:var(--brown);opacity:.85}
.ticket.punch{animation:punch .55s var(--spring)}
@keyframes punch{0%{transform:rotate(1.8deg) translateY(26px) scale(.8)}100%{transform:rotate(1.8deg)}}
.ticket i.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid rgba(139,94,60,.5);vertical-align:1px}

/* title hint */
.hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));z-index:4;transform:translateX(-50%) rotate(-1.5deg);
  background:var(--paper);border:1.5px solid var(--brown);border-radius:5px;padding:9px 20px 8px;text-align:center;white-space:nowrap;
  box-shadow:0 5px 0 rgba(123,183,224,.75);pointer-events:none;animation:hintIn 1s .9s var(--spring) both, bob 2.6s 2s ease-in-out infinite;
  transition:opacity .3s var(--out), transform .5s var(--out)}
.hint:before,.hint:after{content:"";position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#f3e2d3;border:1.5px solid var(--brown)}
.hint:before{left:-7px;clip-path:inset(0 0 0 50%)} .hint:after{right:-7px;clip-path:inset(0 50% 0 0)}
.hint p{font-size:15px;letter-spacing:.04em;font-weight:700}
.hint p i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink);margin:0 9px;vertical-align:2px}
.hint small{display:block;margin-top:3px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#5d93bd}
body.playing .hint, body.over .hint{opacity:0;transform:translateX(-50%) translateY(40px) rotate(4deg);animation:none}
@keyframes hintIn{from{opacity:0;transform:translateX(-50%) translateY(60px) rotate(6deg)}to{opacity:1;transform:translateX(-50%) rotate(-1.5deg)}}
@keyframes bob{0%,100%{margin-bottom:0}50%{margin-bottom:5px}}

/* toast + pause */
.toast{position:fixed;left:50%;top:21%;z-index:6;transform:translate(-50%,-30px) scale(.8);opacity:0;pointer-events:none;
  background:var(--paper);border:1.5px solid var(--brown);border-radius:30px;padding:5px 18px 6px;white-space:nowrap;
  box-shadow:0 4px 0 rgba(123,183,224,.75);font-size:12px;letter-spacing:.04em;transition:transform .6s var(--spring),opacity .35s var(--out)}
.toast b{font-family:var(--script);font-weight:400;font-size:25px;margin-right:8px;vertical-align:-3px}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1}
.pause{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:rgba(255,241,230,.72);opacity:0;pointer-events:none;transition:opacity .3s var(--out)}
.pause.show{opacity:1}
.pause div{font-family:var(--script);font-size:64px;line-height:1;text-align:center;transform:rotate(-4deg) scale(.8);transition:transform .6s var(--spring)}
.pause.show div{transform:rotate(-4deg)}
.pause small{display:block;font-family:var(--round);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#5d93bd;margin-top:10px}

/* receipt */
.receipt{position:fixed;left:50%;top:50%;z-index:8;width:min(318px,88vw);max-height:86vh;display:flex;flex-direction:column;
  background:var(--paper);color:#6d4729;padding:20px 20px 16px;font-family:"Courier New",Courier,monospace;font-size:12.5px;
  filter:drop-shadow(0 10px 0 rgba(123,183,224,.55));transform:translate(-50%,-190%) rotate(-5deg);
  transition:transform .95s var(--spring);visibility:hidden}
.receipt.show{transform:translate(-50%,-50%) rotate(-1.4deg);visibility:visible}
.receipt:before,.receipt:after{content:"";position:absolute;left:0;right:0;height:9px;
  background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/12px 9px repeat-x,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/12px 9px repeat-x}
.receipt:before{top:-9px;transform:scaleY(-1)} .receipt:after{bottom:-9px}
.receipt h2{font-family:var(--script);font-weight:400;font-size:34px;line-height:1;text-align:center;color:var(--brown)}
.receipt .sub{text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin:4px 0 9px;color:#5d93bd;font-family:var(--round)}
.receipt ol{list-style:none;overflow-y:auto;flex:1 1 auto;min-height:40px;border-top:1.5px dashed rgba(139,94,60,.5);border-bottom:1.5px dashed rgba(139,94,60,.5);padding:7px 2px;scrollbar-width:thin;scrollbar-color:var(--tan) transparent}
.receipt li{display:flex;justify-content:space-between;gap:8px;line-height:1.5}
.receipt li span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.receipt li.x span:first-child{text-decoration:line-through;opacity:.6} .receipt li.x span:last-child{font-style:italic;opacity:.75}
.receipt li.p{color:#3f7fae}
.receipt li.none{justify-content:center;font-style:italic;padding:8px 0}
.receipt .tot{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin:8px 2px 2px}
.receipt .tall{font-family:var(--round);font-size:10.5px;letter-spacing:.06em;margin:0 2px 9px;color:#5d93bd}
.receipt blockquote{font-family:var(--script);font-size:23px;line-height:1.08;color:var(--brown);text-align:center;margin:2px 0 3px}
.receipt cite{display:block;text-align:right;font-style:normal;font-family:var(--round);font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:11px}
.again{align-self:center;font-family:var(--round);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--brown);
  background:var(--lemon);border:1.5px solid var(--brown);border-radius:30px;padding:9px 26px;cursor:pointer;box-shadow:0 4px 0 var(--pink);
  transition:transform .35s var(--spring),box-shadow .2s var(--out)}
.again:hover{transform:translateY(-2px) rotate(-2deg);box-shadow:0 6px 0 var(--pink)}
.again:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink)}
.receipt .tap{text-align:center;font-family:var(--round);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-top:9px;color:#5d93bd}

@media (max-width:420px){
  .board{width:124px;padding:7px 10px 6px}.board .row{font-size:17px}.board b{font-size:22px}.board .m{font-size:13px}.board .m b{font-size:18px}
  .ticket{min-width:112px;padding:7px 10px 8px 19px}.ticket strong{font-size:23px}
  .hint p{font-size:13px}.hint{padding:8px 15px 7px}.hint p i{margin:0 6px}
}
@media (max-height:460px){.board{transform-origin:0 100%;scale:.8}.ticket{scale:.8;transform-origin:100% 100%}.receipt{font-size:11px;padding:12px 18px 10px}.receipt h2{font-size:24px}.receipt blockquote{font-size:18px}}
@media (prefers-reduced-motion:reduce){
  .hint{animation:none}.board,.ticket,.receipt,.toast,.btn,.spoons svg,.pause div{transition-duration:.01s}.ticket.punch,.board b.pop{animation:none}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0" role="img" aria-label="Torre di Gelato: a stacking game. A scoop of gelato swings above a waffle cone; press Space, Enter or tap to drop it and build a tower."></canvas>

<div class="top">
  <div class="spoons game-ui" id="spoons" role="img" aria-label="3 spoons left">
    <svg viewBox="0 0 12 34"><path d="M6 1C3 1 1.2 4 1.2 7.6S3.4 13.6 4.7 14v17.2a1.3 1.3 0 0 0 2.6 0V14c1.3-.4 3.5-2.8 3.5-6.4S9 1 6 1z"/></svg>
    <svg viewBox="0 0 12 34"><path d="M6 1C3 1 1.2 4 1.2 7.6S3.4 13.6 4.7 14v17.2a1.3 1.3 0 0 0 2.6 0V14c1.3-.4 3.5-2.8 3.5-6.4S9 1 6 1z"/></svg>
    <svg viewBox="0 0 12 34"><path d="M6 1C3 1 1.2 4 1.2 7.6S3.4 13.6 4.7 14v17.2a1.3 1.3 0 0 0 2.6 0V14c1.3-.4 3.5-2.8 3.5-6.4S9 1 6 1z"/></svg>
  </div>
  <button class="btn game-ui" id="bPause" type="button" aria-pressed="false" aria-label="Pause">
    <svg viewBox="0 0 24 24"><g class="bars"><path d="M9 6v12M15 6v12"/></g><path class="play fill" d="M9 5.5v13l10-6.5z"/></svg>
  </button>
  <button class="btn" id="bSound" type="button" aria-pressed="false" aria-label="Sound is off. Turn sound on">
    <svg viewBox="0 0 24 24"><path class="fill" d="M4 9.5h3.2L12 5.6v12.8l-4.800-3.900H4z"/><path class="on" d="M15.200 9.200a4 4 0 0 1 0 5.600M17.800 6.600a7.600 7.600 0 0 1 0 10.800"/><path class="off" d="M15.500 9.500l5 5M20.500 9.500l-5 5"/></svg>
  </button>
</div>

<div class="board" id="board" aria-live="off">
  <div class="row"><span>scoops</span><b id="vN">0</b></div>
  <div class="row"><span>best today</span><b id="vB">0</b></div>
  <div class="row m"><b id="vM">0,00</b><span>metri di gelato</span></div>
</div>

<div class="ticket" id="ticket"><small>arriva &middot; n.&ordm; <span id="tNo">01</span></small><strong id="tName">fragola</strong><em id="tNote">strawberry</em></div>

<div class="hint" id="hint"><p>tap to drop<i></i>don&rsquo;t let it lean</p><small>tap &middot; click &middot; space &middot; enter</small></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="pause" id="pause"><div>in pausa<small>tap or press P to carry on</small></div></div>

<div class="receipt" id="receipt" role="dialog" aria-label="Receipt from Gelateria Belmonte">
  <h2>Gelateria Belmonte</h2>
  <p class="sub">Lungomare 12 &middot; scontrino n.&ordm; <span id="rNo">001</span></p>
  <ol id="rList"></ol>
  <p class="tot"><span>TOTALE</span><span id="rTot">&euro; 0,00</span></p>
  <p class="tall" id="rTall"></p>
  <blockquote id="rVerdict"></blockquote>
  <cite>&mdash; Signora Belmonte</cite>
  <button class="again" id="bAgain" type="button">Ancora!</button>
  <p class="tap">tap outside &middot; space &middot; enter</p>
</div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), cv=$('c'), g=cv.getContext('2d');
const mq=matchMedia('(prefers-reduced-motion: reduce)'); let reduced=mq.matches; mq.addEventListener('change',e=>{reduced=e.matches});
const CREAM='#FFF1E6',PINK='#F7A8B8',MINT='#B5E2C4',LEMON='#FFE29A',BROWN='#8B5E3C',TAN='#D9A566',BLUE='#7BB7E0',PAPER='#FFF9F1';
const SCRIPT='"Brush Script MT","Segoe Script","Snell Roundhand","Apple Chancery","Lucida Handwriting",cursive';
const ROUND='"Arial Rounded MT Bold","Trebuchet MS","Gill Sans",system-ui,sans-serif';
const CH=90, CONE=120, PIVY=112, STEP=38, AW=670, G=1500, R0=27, TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sgn=v=>v<0?-1:1;
const eo=t=>1-Math.pow(1-clamp(t,0,1),3);
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function mix(a,b,t){const A=hx(a),B=hx(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}

/* ---------- flavours ---------- */
const FL=[
 {n:'fragola',e:'strawberry',c:'#F7A8B8',d:'#EC8AA0',f:'#DF5F7C',k:'bit'},
 {n:'pistacchio',e:'pistachio',c:'#B5E2C4',d:'#94CDA8',f:'#679F7A',k:'nut'},
 {n:'limone',e:'lemon',c:'#FFE29A',d:'#F3CB6E',f:'#FFF8DC',k:'zest'},
 {n:'cioccolato',e:'chocolate',c:'#8B5E3C',d:'#70472A',f:'#553319',k:'chip'},
 {n:'stracciatella',e:'cream with chocolate shards',c:'#FFF9F0',d:'#EAD4BE',f:'#8B5E3C',k:'shard'},
 {n:'nocciola',e:'hazelnut',c:'#D9A566',d:'#C28B49',f:'#8B5E3C',k:'nut'},
 {n:'fior di latte',e:'sweet milk',c:'#FFFDF8',d:'#EBD9C8',f:'#E6D2BF',k:'swirl'},
 {n:'amarena',e:'sour cherry swirl',c:'#FBD3DB',d:'#F1AFBE',f:'#A8455E',k:'cherry'},
 {n:'menta',e:'mint choc-chip',c:'#A6E3D2',d:'#82CCB7',f:'#8B5E3C',k:'chip'},
 {n:'zabaione',e:'marsala custard',c:'#F8CC6E',d:'#E7B24C',f:'#C0883A',k:'seed'}];
const SORB={n:'sorbetto',e:'slippery!',c:'#FFCDB8',d:'#F7A8B8',f:'#FFFFFF',k:'ice'};
const CIALDA={n:'cialda',e:'wafer disc · steadies the tower',c:TAN,d:'#C28B49',f:BROWN,k:'waffle'};
[...FL,SORB,CIALDA].forEach(f=>{f.l=mix(f.c,'#FFFFFF',.45)});

let uid=1;
function mk(fl,o){o=o||{};const r=rng(uid*7919+11);
  const it={id:uid++,fl,name:o.name||fl.n,note:o.note||fl.e,kind:o.kind||'scoop',r:o.r||R0,m:o.m||1,stick:o.stick||1,slipF:o.slipF||1,price:o.price||1.5,
    sq:1,sqv:0,sh:0,shv:0,melt:0,dripT:1.5+r()*3,dx:0,d:0,th:0,w:0,x:0,y:0,vx:0,vy:0,A:0,flecks:[],scal:[],topper:0,grow:0};
  if(it.kind==='waffle'){it.hw=46;it.top=5;it.bot=5}
  else{it.top=.8*it.r;it.bot=.62*it.r;
    for(let i=0;i<10;i++){const a=Math.PI*(1.02+r()*.96),d=it.r*(.22+.6*Math.sqrt(r()));it.flecks.push({x:Math.cos(a)*d,y:Math.sin(a)*d*.92+it.r*.06,a:r()*TAU,s:it.r*(.05+r()*.05)})}
    for(let i=0;i<6;i++)it.scal.push({d:.13+r()*.1,w:r()})}
  return it}

/* ---------- state ---------- */
let W=0,H=0,S=1,VW=400,VH=760,DPR=1;
let state='attract',paused=false,T=[],JI=[],hold=null,fall=null,debris=[],splats=[],parts=[],floats=[],drips=[],waves=[],pools=[{w:0,c:PINK},{w:0,c:PINK}];
let lives=3,hist=[],peak=0,perfN=0,streak=0,best=0,round=0,queue=[],sinceSpecial=0,landed=0;
let camY=0,camX=0,spawnT=0,ph=0,spY=PIVY+150,flick=0,boostT=0,collapse=0,cSign=1,slipCD=0,overT=0,receiptOn=false,aiErr=0;
let wind=0,gustT=5,gustD=0,gustDir=1,sunGlow=0,sunOut=false,bell=.12,time=0,titleT=0,shake=0;

function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  S=Math.min(W/400,H/760);VW=W/S;VH=H/S}
window.addEventListener('resize',resize);resize();

/* ---------- sound ---------- */
let AC=null,soundOn=false,noiseBuf=null;
function tone(f0,f1,dur,vol,type,delay){if(!soundOn||!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),v=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur);
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(vol,t+.012);v.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(v).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}
function sPlop(big){tone(big?250:360,big?80:120,.17,.28);tone(big?120:170,60,.12,.16,'triangle',.02)}
function sBell(){tone(1568,1560,1.1,.16);tone(2349,2340,.7,.07);tone(3136,3130,.4,.04)}
function sSplat(){if(!soundOn||!AC)return;const t=AC.currentTime,src=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain();
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function nextItem(){sinceSpecial++;
  if(landed>=5&&sinceSpecial>3&&T.length&&Math.random()<.24){sinceSpecial=0;const k=Math.random();
    if(k<.34&&T[T.length-1].kind!=='waffle')return mk(CIALDA,{kind:'waffle',m:.5,stick:2.8,slipF:1.5,price:.5});
    if(k<.67)return mk(SORB,{stick:.5,slipF:.62,price:2});
    const f=FL[Math.random()*FL.length|0];return mk(f,{name:'doppio '+f.n,note:'double scoop · heavy',r:R0*1.36,m:2.6,price:3})}
  if(!queue.length)queue=shuffle(FL.slice());return mk(queue.pop())}
function spawn(){const it=nextItem();hold={it,t:0};aiErr=(Math.random()-.5)*11;if(state==='play')ticket(it)}
function flingAll(){for(const s of T)debris.push({it:s,x:s.x,y:s.y,vx:(Math.random()-.5)*420+s.x*3,vy:260+Math.random()*260,rot:s.A,vr:(Math.random()-.5)*9,gy:-5-Math.random()*14,nc:true});T=[];JI=[]}
function reset(mode){flingAll();state=mode;lives=3;hist=[];peak=0;perfN=0;streak=0;landed=0;queue=[];sinceSpecial=0;collapse=0;overT=0;boostT=0;receiptOn=false;
  hold=null;fall=null;drips=[];waves=[];pools[0].w=pools[1].w=0;spawnT=.55;gustT=6;wind=0;for(const s of splats)s.fade=1;
  document.body.classList.toggle('playing',mode==='play');document.body.classList.remove('over');$('receipt').classList.remove('show');hud()}
function start(){round++;reset('play');toast('<b>Pronti!</b>three spoons, one cone')}

function gameOver(){const was=state;state='over';overT=0;hold=null;collapse=.001;cSign=T.length?sgn(T[T.length-1].A||(Math.random()-.5)):1;

  hist.forEach((e,i)=>{if(!e.fallen)tot+=e.price;h+='<li class="'+(e.fallen?'x':'')+'"><span>'+String(i+1).padStart(2,'0')+' '+e.name+'</span><span>'+(e.fallen?'caduta':eur(e.price))+'</span></li>'});

function action(){if(paused){setPause(false);return}

  if(state==='over'){if(receiptOn&&overT>1)start();return}
  if(hold&&hold.t>.12)release()}

/* ---------- physics ---------- */
function topRef(){const n=T.length;return n?T[n-1]:null}
function kin(dt){let px=0,py=PIVY,A=0;for(const s of T){A+=s.th;s.A=A;const c=Math.cos(A),sn=Math.sin(A),x=px+s.dx*c+s.d*sn,y=py-s.dx*sn+s.d*c;
  if(dt){s.vx=(x-s.x)/dt;s.vy=(y-s.y)/dt}s.x=x;s.y=y;px=x;py=y}}
const ACC=[];
function stepTower(dt){const n=T.length;if(!n)return;let Sm=0,Smx=0,Smy=0,Sr=0;const boost=boostT>0?1.6:1,zeta=reduced?1.3:(boostT>0?.42:.085);
  for(let i=n-1;i>=0;i--){const s=T[i];Sm+=s.m;Smx+=s.m*s.x;Smy+=s.m*s.y;Sr+=s.m*(s.x*s.x+s.y*s.y);
    const px=i?T[i-1].x:0,py=i?T[i-1].y:PIVY,Ab=i?T[i-1].A:0,lx=Smx/Sm-px,ly=Smy/Sm-py,cb=Math.cos(Ab),sb=Math.sin(Ab);
    const ll=lx*cb-ly*sb,L=Math.max(lx*sb+ly*cb,8),I=Math.max(Sr-2*px*Smx-2*py*Smy+Sm*(px*px+py*py),0)+Sm*s.r*s.r*.5;
    const mlt=Math.max(s.melt,i?T[i-1].melt:0),stick=s.stick*(i?1:1.5)*(1-.5*mlt)*boost*(1-.9*collapse),na=n-i;
    const Kg=G*Sm*L,Keff=Kg*(.5+1.5/(1+.05*na))*stick+G*s.m*s.r*4*stick,C=2*zeta*Math.sqrt(Keff*I);
    ACC[i]=(G*Sm*ll-(Kg+Keff)*s.th-C*s.w+wind*Sm*L*.022+Kg*.7*collapse*cSign)/I;JI[i]=I}
  let ac=0;for(let i=0;i<n;i++){const s=T[i],a=ACC[i]-(reduced?0:.45*ac);s.w+=a*dt;s.th=clamp(s.th+s.w*dt,-1.3,1.3);ac+=a}
  kin(dt);
  for(const s of T){ if(s.kind==='waffle')continue;
    const rest=1-.07*s.melt;s.sqv+=(-300*(s.sq-rest)-9*s.sqv)*dt;s.sq=clamp(s.sq+s.sqv*dt,.6,1.3);
    const tg=clamp(-s.vx*.0016,-.3,.3);s.shv+=(240*(tg-s.sh)-8*s.shv)*dt;s.sh+=s.shv*dt;
    if(reduced){s.sq=rest;s.sh=0}}
  /* slip */
  slipCD-=dt;if(slipCD<=0){let bad=false;for(let i=0;i<n&&!bad;i++){const s=T[i],mlt=Math.max(s.melt,i?T[i-1].melt:0);
      const lim=.52*s.slipF*(1-.42*mlt)*(1-.92*collapse);if(Math.abs(s.A)+.3*Math.abs(s.dx)/s.r>lim)bad=true}
    if(bad||(collapse>0&&overT>1.1)){detach();slipCD=collapse>0?.085:.15}}
}
function detach(){const s=T.pop();if(!s)return;JI.length=T.length;const d=sgn(s.A||cSign);
  debris.push({it:s,x:s.x,y:s.y,vx:s.vx*.9+d*(55+Math.random()*60),vy:Math.max(s.vy,0)*.6+40+Math.random()*50,rot:s.A,vr:d*(1.6+Math.random()*2.6),gy:-5-Math.random()*15});
  const e=hist.find(h=>h.it===s);if(e)e.fallen=true;
  if(state!=='over'){if(state==='play')toast('<b>Ahi!</b>'+s.name+' has left the building');lose()}hud()}
function release(){const it=hold.it,amp=ampNow(),sp=speedNow();fall={it,x:Math.sin(ph)*amp,y:spY+it.bot+4,vx:Math.cos(ph)*amp*sp*.3,vy:0};hold=null;flick=1}
function ampNow(){return Math.min(VW/2-42,92+T.length*4,172)}
function speedNow(){return state==='play'?Math.min(1.75+T.length*.042,3.7):2.1}
function stepFall(dt){const f=fall,it=f.it;f.vy-=G*dt;f.vx+=wind*.9*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;it.sq=1+Math.min(.16,-f.vy/4200);it.sh*=.9;
  const top=topRef(),tx=top?top.x:0,ty=top?top.y:PIVY,dx=f.x-tx;let reach,d;
  if(!top){reach=it.kind==='waffle'?30:1.15*it.r;d=it.kind==='waffle'?12:.66*it.r+8}
  else{reach=top.kind==='waffle'?top.hw*.94:it.kind==='waffle'?top.r*.9+20:.92*top.r+.12*it.r;
    d=top.top+it.bot-(top.kind==='scoop'&&it.kind==='scoop'?dx*dx/(2.4*top.r):0)}
  if(f.y<=ty+d){if(Math.abs(dx)<=reach)land(f,dx,d,top);else if(f.y<ty-6){fall=null;
      const near=Math.abs(dx)<reach+.7*it.r;debris.push({it,x:f.x,y:f.y,vx:f.vx+(near?sgn(dx)*120:0),vy:near?f.vy*.5:f.vy,rot:0,vr:sgn(dx)*(near?5:2),gy:-5-Math.random()*15});
      if(near&&top){top.w+=sgn(dx)*.5;top.sqv-=1.2}
      if(state==='play')toast('<b>Mamma mia.</b>that one missed');lose();if(state!=='over')spawnT=.6}}}
function land(f,dx,d,top){const it=f.it,n=T.length,perf=Math.abs(dx)<(top&&top.kind==='waffle'?7:4.8);
  if(!top)dx*=.3;if(it.kind==='waffle')dx*=.5;if(perf)dx=0;
  for(let j=0;j<n;j++){const px=j?T[j-1].x:0,py=j?T[j-1].y:PIVY;
    T[j].w+=(perf?.25:1)*(1+(n-j)*.6)*(.22*it.m*-f.vy*(f.x-px)+.5*it.m*f.vx*(f.y-py))/(JI[j]||1e5)}
  it.dx=dx*Math.cos(top?top.A:0);it.d=d;it.th=0;it.w=0;T.push(it);JI.push(it.m*d*d+it.m*it.r*it.r*.5);kin(0);it.vx=it.vy=0;
  if(!reduced){it.sqv=-3.6;it.sq=.97;for(let k=1;k<=5&&n-k>=0;k++)waves.push({it:T[n-k],t:.035*k,v:-3.2*Math.pow(.62,k)})}else it.sq=1;
  fall=null;landed++;hist.push({name:it.name,price:it.price,it,fallen:false});peak=Math.max(peak,T.length);spawnT=.42;
  sPlop(it.m>2);
  if(perf){perfN++;streak++;boostT=3;for(const s of T)s.w*=.35;sprinkle(it.x,it.y+it.top*.2);sBell();
    floats.push({x:it.x,y:it.y+it.r+16,t:0,txt:streak>=3&&streak%3===0?'perfetto × tre!':'perfetto!'});
    if(streak%3===0&&it.kind==='scoop')it.topper=(perfN/3|0)%2?1:2}
  else streak=0;
  if(state==='play'){const m=MARK.find(k=>k[0]===T.length);if(m&&peak===T.length){toast('<b>'+m[0]+'</b>scoops: '+m[1]);if(m[0]===40){bell=1;sBell()}}}
  hud()}
function sprinkle(x,y){const cols=[PINK,MINT,LEMON,BLUE,BROWN,'#FFFFFF'],n=reduced?10:30;
  for(let i=0;i<n;i++){const a=Math.random()*TAU,v=90+Math.random()*230;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.abs(Math.sin(a))*v+60,rot:a,vr:(Math.random()-.5)*16,c:cols[i%6],life:1+Math.random()*.6,k:0})}}
function splat(d){const it=d.it,r=it.r;splats.push({x:d.x,y:d.gy,it,t:0,w:r*(1.9+Math.random()*.7),fade:0,dr:[0,1,2,3,4].map(()=>({dx:(Math.random()-.5)*r*5,dy:(Math.random()-.5)*10,r:2+Math.random()*4}))});
  if(splats.length>16)splats.shift();sSplat();shake=reduced?0:1;
  for(let i=0;i<(reduced?4:12);i++){const a=Math.random()*Math.PI;parts.push({x:d.x,y:d.gy+4,vx:Math.cos(a)*(80+Math.random()*200),vy:Math.sin(a)*(140+Math.random()*220),rot:0,vr:0,c:it.fl.c,life:.7+Math.random()*.4,k:1})}}
function surfX(y,side){if(y>CONE){for(const s of T)if(Math.abs(s.y-y)<s.r*.95){const h=y-s.y;return s.x+side*Math.sqrt(Math.max(s.r*s.r-h*h,9))*1.02}return null}
  return side*Math.max(31*(y-10)/(CONE-10),23)}

function update(dt){time+=dt;titleT+=dt;
  /* wind */
  gustT-=dt;if(gustT<=0&&gustD<=0){gustD=2.6;gustDir=Math.random()<.5?-1:1;gustT=5+Math.random()*6}
  let wt=0;if(gustD>0){gustD-=dt;wt=Math.pow(Math.sin(Math.PI*(1-gustD/2.6)),2)*gustDir*clamp((T.length-3)*5,0,150)}
  wind+=(wt-wind)*Math.min(1,dt*5);
  /* sun */
  const co=120*Math.sin(time*.21+.6);sunOut=Math.abs(co)>44&&camY<2800;sunGlow+=((sunOut?1:0)-sunGlow)*Math.min(1,dt*2);
  bell+=(.12-bell)*Math.min(1,dt*.35);boostT-=dt;flick*=Math.pow(.004,dt);shake*=Math.pow(.002,dt);
  /* pendulum */
  ph+=speedNow()*dt;const top=topRef(),ty=top?top.y:PIVY+6;spY+=((ty+150)-spY)*Math.min(1,dt*5);
  if(hold){hold.t+=dt;hold.it.grow=Math.min(1,hold.t/.3);const sp=speedNow();
    hold.it.shv+=(240*(clamp(-Math.cos(ph)*ampNow()*sp*.0011,-.25,.25)-hold.it.sh)-9*hold.it.shv)*dt;hold.it.sh+=hold.it.shv*dt;if(reduced)hold.it.sh=0;
    if(state==='attract'&&hold.t>.55){const amp=ampNow(),sx=Math.sin(ph)*amp,vx=Math.cos(ph)*amp*sp*.3,tf=Math.sqrt(2*110/G);
      if(Math.abs(sx+vx*tf-((top?top.x+top.vx*tf*.5:0)+aiErr))<3.5)release()}}
  else if(!fall&&state!=='over'){spawnT-=dt;if(spawnT<=0)spawn()}
  /* tower */
  const sub=3,h=dt/sub;for(let i=0;i<sub;i++){stepTower(h);if(fall)stepFall(h)}
  for(let i=waves.length-1;i>=0;i--){const w=waves[i];w.t-=dt;if(w.t<=0){w.it.sqv+=w.v;waves.splice(i,1)}}
  /* melt + drips */
  const mr=(state==='play'?.011:.006)*(sunOut?2.4:1);
  for(let i=0;i<T.length;i++){const s=T[i];if(s.kind==='waffle')continue;s.melt=Math.min(1,s.melt+mr*(s.fl===SORB?1.7:1)*dt);
    if(s.melt>.22&&!reduced){s.dripT-=dt*s.melt*(sunOut?1.8:1);if(s.dripT<=0&&drips.length<46){s.dripT=1.6+Math.random()*2.6;drips.push({it:s,side:Math.random()<.5?-1:1,t:0,x:0,y:0,sz:2.4+Math.random()*1.8,slide:false,v:0})}}}
  for(let i=drips.length-1;i>=0;i--){const d=drips[i];
    if(!d.slide){d.t+=dt/1.3;const s=d.it;d.x=s.x+d.side*s.r*.9;d.y=s.y-s.r*.52;if(T.indexOf(s)<0){drips.splice(i,1);continue}if(d.t>=1)d.slide=true}
    else{const sx=surfX(d.y,d.side);d.v=sx===null?d.v+G*.5*dt:lerp(d.v,d.y>CONE?36:70,dt*4);d.y-=d.v*dt;if(sx!==null)d.x+=(sx-d.x)*Math.min(1,dt*14);
      if(d.y<=2){const p=pools[d.side<0?0:1];p.w=Math.min(56,p.w+d.sz*1.1);p.c=d.it.fl.c;drips.splice(i,1)}}}
  /* debris */
  for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.vy=Math.max(d.vy-G*dt,-1500);d.x+=d.vx*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt;d.it.sq+=(1.08-d.it.sq)*dt*6;d.it.sh*=.9;
    if(d.y<=d.gy+d.it.r*.4){splat(d);debris.splice(i,1)}}
  for(let i=splats.length-1;i>=0;i--){const s=splats[i];s.t+=dt;if(s.fade){s.fade-=dt*1.2;if(s.fade<=0)splats.splice(i,1)}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy-=G*.55*dt;p.vx*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.life<=0||p.y<-30)parts.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>1.5)floats.splice(i,1)}
  /* flow */
  if(state==='attract'&&!fall&&T.length>=13)gameOver();
  if(state==='over'){overT+=dt;collapse=Math.min(1,collapse+dt*.55);
    if(overT<0){if(!T.length&&!debris.length){reset('attract')}}
    else if(!receiptOn&&overT>1.6&&!T.length&&!debris.length)showReceipt()}
  /* camera */
  const tgt=Math.max(0,(top?top.y:PIVY)+222-(VH-CH));camY+=(tgt-camY)*(1-Math.exp(-dt*(state==='over'?1.5:2.4)));
  const cx=reduced||!top?0:top.x*.22;camX+=(cx-camX)*(1-Math.exp(-dt*1.6));
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function drawScoop(it,x,y,rot){g.save();g.translate(x,-y);g.rotate(rot);
  if(it.kind==='waffle'){const w=it.hw*(it.grow<1&&hold&&hold.it===it?eo(it.grow):1);rr(-w,-6,w*2,12,5);g.fillStyle=TAN;g.fill();g.save();g.clip();g.strokeStyle='rgba(139,94,60,.6)';g.lineWidth=1;g.beginPath();
